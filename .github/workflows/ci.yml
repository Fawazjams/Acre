name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements-dev.txt
      - run: pip install -r cloud/requirements-dev.txt
      - name: Lint
        run: ruff check cloud --select E9,F63,F7,F82
      - name: Test
        run: pytest cloud/tests -q

  docker-build:
    runs-on: ubuntu-latest
    needs: cloud-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: false
          tags: acre-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
